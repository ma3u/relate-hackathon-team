name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install relate CLI (signature-checked installer)
        run: |
          curl -sSfL https://relatedb.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: relate --version && relate telemetry off
      - name: Python deps
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q
      - name: Swift Cypher is generated from the Python
        run: .venv/bin/python scripts/gen_swift_cypher.py --check
      - name: Import fixtures with the CLI
        run: |
          .venv/bin/python -m health_graph import --db health.rl fixtures/fhir/*.json
          .venv/bin/python -m health_graph query --db health.rl reports

  swift:
    # The same graph in Swift: the HealthGraph library (iPhone + Mac) and the
    # Mac receiver/CLI, checked against the same fixtures as the Python tests.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift test --package-path swift/mac
