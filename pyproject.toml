[project]
name = "relate-health-graph"
version = "0.1.0"
description = "Sovereign Health Graph: Klarbefund FHIR bundles in a local Relate graph (Relate by Neo4j Hackathon)"
requires-python = ">=3.11"
dependencies = ["relate-db>=1.0.0", "segno>=1.6"]

[project.optional-dependencies]
voice = ["elevenlabs>=2.0", "python-dotenv"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# One Python package. Without this, setuptools' flat-layout discovery also finds
# apps/, swift/ and fixtures/ and refuses to build ("Multiple top-level
# packages"), which broke the test workflow once apps/ (Klarbefund for Mac) came.
[tool.setuptools]
packages = ["health_graph"]

[tool.setuptools.package-data]
health_graph = ["*.json", "*.cypher"]
