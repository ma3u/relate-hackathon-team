<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Graph 3D</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --bg: #0e1116; --panel: rgba(22, 26, 33, 0.92); --line: #2a303a; --ink: #e8e6df; --muted: #9c9a92; --accent: #5DCAA5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overflow: hidden; }
  #graph { position: absolute; inset: 0; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(6px); }
  #side { top: 16px; left: 16px; width: 290px; max-height: calc(100% - 32px); overflow-y: auto; }
  #detail { top: 16px; right: 16px; width: 364px; max-height: calc(100% - 32px); overflow-y: auto; display: none; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  input[type=search] { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0b0d11; color: var(--ink); font: inherit; }
  #hits { margin: 6px 0 0; }
  #hits button, .nb { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 3px 4px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  #hits button:hover, .nb:hover { background: #222833; }
  .fam { margin-top: 14px; }
  .fam h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; font-size: 13px; }
  label.row input { margin: 0; accent-color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .btns button { background: #1b2029; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .btns button:hover { border-color: #444c58; }
  #detail h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  #detail .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  #detail ul { margin: 0 0 10px; padding-left: 18px; }
  #detail .rel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 2px; }
  .close { float: right; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 7px 10px; margin: 8px 0 4px; font-size: 12px; line-height: 1.45; }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .steps button { text-align: left; background: #1b2029; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .steps button b { color: var(--muted); font-weight: 600; margin-right: 4px; }
  .steps button[aria-selected=true] { border-color: var(--accent); background: #16312a; }
  #stepHint { margin-top: 8px; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-50%, -150%); font-size: 11px; color: #e8e6df; white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 6px #000; }
  .trail { font-size: 12px; color: var(--muted); margin: 0 24px 8px 0; line-height: 1.6; }
  .trail a { color: var(--accent); text-decoration: none; }
  .trail a:hover { text-decoration: underline; }
  .nb.inset, .hint.inset { padding-left: 20px; }
  .nb.code { font-weight: 600; margin-top: 6px; }
  .flag { color: #F09595; }
  #history { left: 50%; transform: translateX(-50%); bottom: 16px; display: none; align-items: center; gap: 6px; padding: 8px 10px;
    max-width: calc(100% - 720px); min-width: 220px; overflow-x: auto; }
  #history .backbtn { flex: none; background: #1b2029; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #history .card { flex: none; width: 138px; background: #0b0d11; border: 1px solid var(--line); border-radius: 8px; padding: 4px; cursor: pointer; color: var(--ink); text-align: left; font: inherit; }
  #history .card:hover { border-color: #5a6372; }
  #history .card.now { border-color: var(--accent); cursor: default; box-shadow: 0 0 0 1px var(--accent) inset; }
  #history .card img, #history .card .ph { width: 100%; height: 72px; object-fit: cover; border-radius: 5px; display: block; background: #0e1116; }
  #history .card .k { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  #history .card.now .k { color: var(--accent); }
  #history .card .t { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #history .sep { color: var(--muted); flex: none; }
  #caption { top: 16px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 720px)); min-width: 260px; padding: 10px 14px; }
  #caption .k { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  #caption .t { font-size: 13px; line-height: 1.45; margin-top: 2px; }
  #topics details { margin: 2px 0; }
  #topics summary { cursor: pointer; font-size: 13px; padding: 2px 0; display: flex; gap: 6px; align-items: center; }
  #topics summary .count { margin-left: auto; }
  #topics .nb { font-size: 12px; padding-left: 14px; }
  #labels div.year { color: #EF9F27; font-weight: 600; font-size: 12px; }
  .chart { display: block; margin: 4px 0 2px; overflow: visible; }
  .chart text { font: 10px -apple-system, system-ui, sans-serif; fill: var(--muted); }
  .chart .last { fill: var(--ink); font-size: 11px; font-weight: 600; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .hit:hover + .pt, .chart .pt.hl { stroke: #fff; stroke-width: 2; }
  .chartnote { font-size: 11px; color: var(--muted); margin: 0 0 6px; }
  .chartnote i { font-style: normal; display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .risk { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
  .risk.main { border-color: #8a3b3b; background: rgba(226, 75, 74, 0.08); }
  .risk .head { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; color: var(--ink); font: inherit; font-weight: 600; padding: 0; cursor: pointer; text-align: left; }
  .chip { margin-left: auto; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.main { color: #fff; background: #E24B4A; border-color: #E24B4A; }
  .chip.watch { color: #F7C1C1; border-color: #8a3b3b; }
  .sc { display: flex; gap: 7px; align-items: baseline; font-size: 12px; margin: 4px 0 0 2px; }
  .sc .lt { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .age { color: var(--muted); }
  .kicker { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .q { margin: 9px 0 2px; font-size: 12px; }
  .q .opts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .q button { background: #1b2029; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 11px; cursor: pointer; }
  .q button[aria-pressed=true] { border-color: var(--accent); background: #16312a; }
  .q .note { color: var(--muted); font-size: 11px; margin-top: 4px; }
  #labels div.depth { color: #EF9F27; font-size: 11px; opacity: .8; }
  .scene-tooltip { font: 13px/1.4 -apple-system, system-ui, sans-serif !important; background: rgba(14,17,22,.92) !important; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px !important; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="labels"></div>

<div id="side" class="panel">
  <h1>Health graph in 3D</h1>
  <p class="sub" id="totals"></p>
  <input type="search" id="q" placeholder="Search: HbA1c, a lab, a LOINC code…" autocomplete="off">
  <div id="hits"></div>
  <div id="steps" class="steps" role="tablist"></div>
  <p class="hint" id="stepHint"></p>
  <div id="legend"></div>
  <div id="topics"></div>
  <div class="btns">
    <button id="next">Next step →</button>
    <button id="fit">Fit view</button>
    <button id="ovbtn">Your risk overview</button>
  </div>
  <p class="hint">Drag to rotate, scroll to zoom, right-drag to pan. Click a node to drill down into its relationships. The bar at the bottom shows where you are and where you came from: click a perspective, or press Esc, to go back.</p>
</div>

<div id="detail" class="panel"></div>
<div id="caption" class="panel" aria-live="polite"></div>
<nav id="history" class="panel" aria-label="Perspectives"></nav>

<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/dist/3d-force-graph.min.js"></script>
<script>
const DATA = /*DATA*/null;

const FAMILIES = [
  ["Risks", [["HealthRisk", "#F09595"], ["RiskScore", "#ED93B1"]]],
  ["Evidence", [["Study", "#F5C4B3"], ["Guideline", "#FAEEDA"], ["Topic", "#EEEDFE"]]],
  ["Measures", [
    ["Lab value", "#5DCAA5"], ["Apple Watch week", "#85B7EB"], ["LoincCode", "#D3D1C7"],
    ["ReferenceRange", "#AFA9EC"], ["NcbiTaxon", "#888780"]]],
  ["Documents", [
    ["Patient", "#ffffff"], ["DiagnosticReport", "#1D9E75"], ["DocumentReference", "#97C459"],
    ["Provenance", "#C0DD97"], ["Organization", "#FAC775"]]],
  ["Research copy", [["OMOPPerson", "#F0997B"], ["OMOPMeasurement", "#D85A30"], ["Knowledge", "#7F77DD"]]],
];
const OUT_COLOR = "#E24B4A";

// ── Time: newer values weigh more ─────────────────────────────────────────
// A display rule, not a clinical one: a value counts half after one year and a
// quarter after two, and sits further back (z) and smaller in the view. An old
// value describes the past; it needs a recheck before it says much about now.
const YEAR = 365.25 * 864e5, HALF_LIFE = 1, DEPTH = 140;
const TODAY = DATA.today ? Date.parse(DATA.today) : Date.now(), TODAY_YEAR = new Date(TODAY).getUTCFullYear();
const ageY = dt => dt ? Math.max(0, (TODAY - Date.parse(String(dt).slice(0, 10))) / YEAR) : NaN;
const weightOf = dt => { const a = ageY(dt); return isNaN(a) ? 1 : Math.pow(0.5, a / HALF_LIFE); };
const isDated = n => n.g === "Lab value" || n.g === "Apple Watch week" || n.g === "OMOPMeasurement";
const recency = n => isDated(n) && n.dt ? (n._w ??= weightOf(n.dt)) : 1;
const ago = dt => {
  const a = ageY(dt);
  return isNaN(a) ? "" : a < 1 / 12 ? "this month" : a < 1 ? `${Math.round(a * 12)} months ago` : `${a.toFixed(1)} years ago`;
};
// Older: closer to the background colour.
function fade(hex, w) {
  const t = (1 - Math.max(w, 0.15)) * 0.7, bg = [14, 17, 22];
  return "#" + [1, 3, 5].map((i, k) => {
    const v = parseInt(hex.slice(i, i + 2), 16);
    return Math.round(v + (bg[k] - v) * t).toString(16).padStart(2, "0");
  }).join("");
}
// Your standing on a risk, from your newest values and the published scores.
const STATUS = {
  main: { color: "#E24B4A", label: "Your main risk", short: "your main risk" },
  watch: { color: "#F09595", label: "Worth watching", short: "worth watching" },
  clear: { color: "#8a7d80", label: "No sign in recent values", short: "no sign" },
  old: { color: "#6a6470", label: "Too little recent data", short: "data too old" },
  none: { color: "#6a6470", label: "No values of yours yet", short: "no data" },
};
const RISK_LINK = "#EF9F27";  // (:HealthRisk)-[:RAISES_RISK_OF]->(:HealthRisk), from studies
const CITE_LINK = "#F5C4B3";  // (:Study)-[:CITES]->(:Study)
const COLOR = {}, VISIBLE = {};
FAMILIES.forEach(([, gs]) => gs.forEach(([g, c]) => { COLOR[g] = c; VISIBLE[g] = true; }));
const groupsOf = (...fams) => FAMILIES.filter(([f]) => fams.includes(f)).flatMap(([, gs]) => gs.map(([g]) => g));
const isEvidence = n => n.g === "Study" || n.g === "Guideline";
const MEASURES = groupsOf("Measures"), DOCS = groupsOf("Documents"), RESEARCH = groupsOf("Research copy");

// Risks first, then the evidence behind them, then the measures, then the documents.
const STAGES = [
  { name: "Health risks", groups: ["HealthRisk", "RiskScore", "Study", "Guideline", "LoincCode", "Lab value"],
    // The marker codes you have a value on, your newest value on each, the evidence about the risks.
    only: n => n.g === "LoincCode" ? n.mk && (n._hv ??= n.nbs.some(([t, m]) => t === "CODED_BY" && m.g === "Lab value"))
      : n.g === "Lab value" ? n.cur : isEvidence(n) ? n.nbs.some(([t]) => t === "ABOUT") : true,
    get hint() {
      const main = RANKED.find(n => n.st.status === "main");
      return (main ? `Your main risk: ${main.n}, the large red node. ` : "No risk stands out in your recent values. ") +
        "The six health risks are conditions the knowledge layer tracks for everyone, not diagnoses; nothing links you to one. " +
        "Each is sized and coloured by your newest values on its markers and the published scores: red your main risk, pink worth watching, grey no sign or data too old. " +
        "Around them: risk scores (pink), lab markers (grey) and your latest value on each (green; red outside the lab's range). " +
        "Older values sit further back and are smaller: a value counts half after a year. Your overview is on the right; click a risk for its values.";
    } },
  { name: "Evidence", groups: ["HealthRisk", "RiskScore", "Study", "Guideline", "Topic"], only: () => true,
    get hint() { return `All ${(counts.Study || 0) + (counts.Guideline || 0)} sources behind the graph:` + this.rest; },
    rest: " studies (coral) and guidelines (amber), clustered around their topics (white). A thin arrow from one source to another means it cites it. Orange arrows: in studies, people who have one condition develop another more often. Click a topic or a source." },
  { name: "Measures", groups: ["HealthRisk", "RiskScore", ...MEASURES], only: () => true, spiral: true,
    hint: "Every lab value (green) and Apple Watch week (blue) on a time spiral: one turn per year, the oldest at the bottom, the newest at the top; a small cluster is one day (one report, one week). Grey LOINC codes tie together the values of one marker; purple: guideline ranges." },
  { name: "Documents", groups: ["HealthRisk", "RiskScore", ...MEASURES, ...DOCS], only: () => true, spiral: true,
    hint: "Adds you (white), the scanned reports (dark green), their documents, how they were scanned (provenance) and the labs, around the same time spiral of your values." },
  { name: "Everything", groups: ["HealthRisk", "RiskScore", "Study", "Guideline", ...MEASURES, ...DOCS, ...RESEARCH], only: () => true, spiral: true,
    hint: "Adds the evidence and the OMOP research copy (orange): each of your values in the format a research study would receive." },
];
let stage = 0;

// Topic hubs exist only in this view: they cluster the evidence (Study.topics in the graph).
const topicNodes = new Map();
DATA.nodes.filter(n => n.topics && n.topics.length).forEach(n => n.topics.forEach(t => {
  if (!topicNodes.has(t)) topicNodes.set(t, { id: "topic:" + t, g: "Topic", n: t, d: ["A topic: the studies and guidelines about it"] });
  DATA.links.push({ source: n.id, target: "topic:" + t, t: "IN_TOPIC" });
}));
DATA.nodes.push(...topicNodes.values());
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const nodeById = v => byId.get(v) ?? byId.get(+v);
DATA.nodes.forEach(n => { n.deg = 0; n.nbs = []; });
DATA.links.forEach(l => {
  const a = byId.get(l.source), b = byId.get(l.target);
  a.deg++; b.deg++; a.nbs.push([l.t, b, "out"]); b.nbs.push([l.t, a, "in"]);
  if (l.t === "RAISES_RISK_OF") {
    (a.rlinks = a.rlinks || []).push({ dir: "out", other: b, p: l.p || {} });
    (b.rlinks = b.rlinks || []).push({ dir: "in", other: a, p: l.p || {} });
  }
});
const FRIENDLY = {
  "← EXAMINES": "Studies about this marker", "INFORMS →": "Risk scores it informs", "← INFORMS": "Studies behind this score",
  "CITES →": "Cites", "← CITES": "Cited by (in this graph)", "IN_TOPIC →": "Topic", "← IN_TOPIC": "Studies and guidelines",
  "ABOUT →": "Risks it is about", "SOURCED_FROM →": "Source (guideline or study)", "← SOURCED_FROM": "Reference ranges it sets", "← ABOUT": "Studies about this risk", "MARKER_OF →": "Marker of", "← MARKER_OF": "Its markers",
};
const studyById = new Map(DATA.nodes.filter(n => n.sid).map(n => [n.sid, n]));
const effect = p => p.estimate == null ? "" :
  ` · ${(p.measure || "").split(",")[0]} ${p.estimate}${p.ciLow != null ? ` (${p.ciLow}–${p.ciHigh})` : ""}`;
const counts = {};
DATA.nodes.forEach(n => counts[n.g] = (counts[n.g] || 0) + 1);
document.getElementById("totals").textContent =
  `${DATA.nodes.length.toLocaleString()} nodes · ${DATA.links.length.toLocaleString()} relationships · Neo4j Relate`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const endId = e => typeof e === "object" ? e.id : e;

let selected = null, hl = new Set(), hlLinks = new Set();

const Graph = new ForceGraph3D(document.getElementById("graph"))
  .backgroundColor("#0e1116")
  .nodeId("id")
  .nodeVal(n => n.g === "Patient" ? 30 : n.g === "Topic" ? 14
    : n.g === "HealthRisk" && n.st && !drill.length ? 4 + 6 * Math.min(n.st.E, 3) + (n.st.status === "main" ? 12 : 0)
    : (1 + Math.pow(n.deg, 0.55) + (n.cur ? 3 : 0) + (n.out ? 4 : 0)) * (0.3 + 0.7 * recency(n)) + (n === selected ? 12 : 0))
  .nodeRelSize(3)
  .nodeOpacity(0.92)
  .nodeResolution(12)
  .nodeColor(n => n.g === "HealthRisk" && n.st ? STATUS[n.st.status].color : fade(n.out ? OUT_COLOR : COLOR[n.g], recency(n)))
  .nodeLabel(n => `<b>${esc(n.n)}</b><br><span style="color:${COLOR[n.g]}">${esc(n.g)}</span>` +
    (n.d.length ? "<br>" + n.d.slice(0, 3).map(esc).join("<br>") : ""))
  .linkColor(l => hlLinks.has(l) ? "#ffffff" : l.t === "RAISES_RISK_OF" ? RISK_LINK : l.t === "CITES" ? CITE_LINK
    : l.t === "IN_TOPIC" ? "#EEEDFE" : (COLOR[l.source.g || nodeById(l.source).g] || "#555"))
  .linkOpacity(0.22)
  .linkWidth(l => hlLinks.has(l) ? 1.4 : l.t === "RAISES_RISK_OF" ? 1.2 : l.t === "CITES" ? 0.7 : 0)
  .linkCurvature(l => l.t === "RAISES_RISK_OF" ? 0.2 : l.t === "CITES" ? 0.1 : 0)
  .linkDirectionalArrowLength(l => l.t === "RAISES_RISK_OF" ? 7 : l.t === "CITES" ? 4 : 0)
  .linkDirectionalArrowRelPos(0.92)
  .linkDirectionalArrowColor(l => l.t === "CITES" ? CITE_LINK : RISK_LINK)
  .linkLabel(l => l.t === "RAISES_RISK_OF" && l.p ? `<b>${esc(l.source.n)} → ${esc(l.target.n)}</b>${esc(effect(l.p))}<br>${esc(l.p.summary || "")}` : "")
  .linkDirectionalParticles(l => hlLinks.has(l) ? 3 : 0)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleSpeed(0.006)
  .onNodeClick(focusNode)
    .cooldownTicks(220)
  .warmupTicks(40);

// No centring force: it moves every free node to keep the average in the middle, and with
// hundreds of values pinned on a spiral it would push a lone hub (you) off screen. zoomToFit frames.
Graph.d3Force("center", null);
// Values pinned on the time spiral push nothing away (712 of them would fling a hub off screen).
Graph.d3Force("charge").strength(m => m.fx !== undefined && DATED.has(m.g) ? 0 : -28);
Graph.d3Force("link").distance(l => (l.t === "HAS_OBSERVATION" ? 60 : l.t === "IN_TOPIC" ? 18 : 26));
// Time as depth: every dated value that is not pinned on the time spiral is pulled
// back by its age, DEPTH per year, so the newest values are in front. In a
// drill-down the depth is measured from the node in focus (pinned where you
// clicked it), so its own report's values stay next to it.
let timeNodes = [];
const timeForce = alpha => {
  const top = drill[drill.length - 1];
  const z0 = top ? top.z || 0 : 0, a0 = top && top.dt && isDated(top) ? ageY(top.dt) : 0;
  timeNodes.forEach(n => {
    if (n.fz !== undefined || !n.dt || !isDated(n)) return;
    const a = ageY(n.dt);
    if (!isNaN(a)) n.vz += (z0 - DEPTH * (a - (isNaN(a0) ? 0 : a0)) - (n.z || 0)) * 0.15 * alpha;
  });
};
timeForce.initialize = ns => { timeNodes = ns; };
Graph.d3Force("time", timeForce);

const shown = n => VISIBLE[n.g] && STAGES[stage].groups.includes(n.g) && STAGES[stage].only(n);
const short = t => (t = String(t)).length > 26 ? t.slice(0, 25) + "…" : t;
const nb = (n, types) => n.nbs.filter(([t]) => !types || types.includes(t)).map(x => x[1]);
const HUB = new Set(["Patient", "OMOPPerson", "Knowledge", "Organization", "LoincCode"]);
let drill = [];   // the drill-down trail; the last node is in focus

// What a click opens: a risk shows its scores, marker codes, all your values on
// them and the guideline ranges; a code its values and their reports; anything
// else its neighbours and theirs (not through hubs such as you or a LOINC code).
function markerCodes(n) {
  if (n.g === "LoincCode") return [n];
  if (n.g === "RiskScore") return nb(n, ["USES"]);
  if (n.g === "HealthRisk") return [...new Set([...nb(n, ["MARKER_OF"]), ...nb(n, ["ESTIMATES"]).flatMap(x => nb(x, ["USES"]))])];
  return [];
}
function drillSet(n) {
  const S = new Set([n]), add = ms => ms.forEach(m => S.add(m));
  if (n.g === "HealthRisk") add(nb(n, ["RAISES_RISK_OF", "ABOUT"]));
  if (["HealthRisk", "RiskScore", "LoincCode"].includes(n.g)) {
    add(nb(n, ["ESTIMATES", "MARKER_OF", "USES"]));
    markerCodes(n).forEach(c => {
      S.add(c);
      add(nb(c, ["CODED_BY"]).filter(o => o.g === "Lab value" || (n === c && o.g === "Apple Watch week")));
      add(nb(c, ["APPLIES_TO"]));
    });
    if (n.g === "LoincCode") [...S].filter(o => o.g === "Lab value").forEach(o => add(nb(o, ["HAS_RESULT"])));
    if (n.g === "LoincCode") add(nb(n, ["EXAMINES"]));
    if (n.g === "RiskScore") add(nb(n, ["INFORMS"]));
  } else if (n.g === "Topic") {
    // A topic: its sources, the risks they are about, and the citations among them.
    const members = nb(n, ["IN_TOPIC"]);
    add(members);
    members.forEach(m => add(nb(m, ["ABOUT", "INFORMS"])));
  } else {
    const first = nb(n);
    add(first);
    if (first.length <= 120) first.filter(m => !HUB.has(m.g)).forEach(m => add(nb(m)));
  }
  return S;
}

function setData(keep) {
  const links = DATA.links.filter(l => keep.has(nodeById(endId(l.source))) && keep.has(nodeById(endId(l.target))));
  // Many dated values: on a time spiral around the node in focus (or the middle).
  const top = drill[drill.length - 1];
  if (top ? true : STAGES[stage].spiral) layoutSpiral([...keep], top ? { x: top.x || 0, y: top.y || 0, z: top.z || 0 } : { x: 0, y: 0, z: 0 });
  else clearSpiral();
  Graph.graphData({ nodes: [...keep], links });
  buildLabels([...keep]);
}

// ── Time spiral ───────────────────────────────────────────────────────────
// Values sorted by date on a helix: one turn per year (the same month lines up
// vertically), the oldest at the bottom, the newest at the top; the values of one
// day form a small cluster (one report, one Apple Watch week).
const DATED = new Set(["Lab value", "Apple Watch week", "OMOPMeasurement"]);
let spiralPinned = [], spiralMarks = [];
function clearSpiral() {
  spiralPinned.forEach(m => { if (!drill.includes(m)) { delete m.fx; delete m.fy; delete m.fz; } });
  spiralPinned = []; spiralMarks = [];
}
function layoutSpiral(nodes, c) {
  clearSpiral();
  const pts = nodes.filter(m => DATED.has(m.g) && m.dt && !drill.includes(m))
    .map(m => ({ m, t: Date.parse(m.dt.slice(0, 10)) })).filter(q => !isNaN(q.t)).sort((a, b) => a.t - b.t);
  if (pts.length < 12 || new Set(pts.map(q => q.t)).size < 4) return;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, y0 = new Date(t0).getUTCFullYear();
  const years = Math.max((t1 - t0) / (365.25 * 864e5), 0.25);
  const R = 90 + Math.min(150, pts.length * 0.1), H = Math.max(180, years * 130);
  const at = t => ({ a: 2 * Math.PI * (t - Date.UTC(y0, 0, 1)) / (365.25 * 864e5), y: c.y - H / 2 + (t - t0) / ((t1 - t0) || 1) * H });
  const sameDay = {};
  pts.forEach(({ m, t }) => {
    // Values of one day form a small round cluster (golden-angle packing), not a long spoke.
    const k = sameDay[t] = (sameDay[t] || 0) + 1, { a, y } = at(t);
    const rho = 5 * Math.sqrt(k - 1), phi = (k - 1) * 2.39996, r = R + rho * Math.cos(phi);
    m.fx = m.x = c.x + r * Math.cos(a); m.fy = m.y = y + rho * Math.sin(phi); m.fz = m.z = c.z + r * Math.sin(a);
    m.vx = m.vy = m.vz = 0;
    spiralPinned.push(m);
  });
  for (let yr = y0; yr <= new Date(t1).getUTCFullYear(); yr++) {
    const t = Math.max(t0, Date.UTC(yr, 0, 1)), { a, y } = at(t);
    spiralMarks.push({ x: c.x + (R - 28) * Math.cos(a), y, z: c.z + (R - 28) * Math.sin(a), label: String(yr) });
  }
}
function applyFilter() {
  setData(drill.length ? drillSet(drill[drill.length - 1]) : new Set(DATA.nodes.filter(shown)));
  Graph._fitted = false;
}

function refresh() {
  Graph.nodeColor(Graph.nodeColor()).nodeVal(Graph.nodeVal()).linkColor(Graph.linkColor())
    .linkWidth(Graph.linkWidth()).linkDirectionalParticles(Graph.linkDirectionalParticles());
}

// ── Navigation: perspectives you can see and return to ──────────────────
// views[i] is the perspective at depth i (0 = the overview step), saved when
// you leave it: a thumbnail, the camera, and every node's position, so going
// back restores exactly what you saw.
let views = [], curThumb = null, busy = false;

function snapshot() {
  const r = Graph.renderer();
  r.render(Graph.scene(), Graph.camera());
  const src = r.domElement, c = document.createElement("canvas");
  c.width = 276; c.height = 144;
  const k = Math.max(c.width / src.width, c.height / src.height);
  const w = src.width * k, h = src.height * k;
  c.getContext("2d").drawImage(src, (c.width - w) / 2, (c.height - h) / 2, w, h);
  const cam = Graph.camera().position, t = Graph.controls().target;
  return {
    thumb: c.toDataURL("image/jpeg", 0.8),
    cam: { x: cam.x, y: cam.y, z: cam.z }, target: { x: t.x, y: t.y, z: t.z },
    pos: new Map(Graph.graphData().nodes.map(n => [n.id, [n.x, n.y, n.z]])),
  };
}

const pin = n => { n.fx = n.x; n.fy = n.y; n.fz = n.z; };
const unpin = n => { delete n.fx; delete n.fy; delete n.fz; };
const linksOf = n => new Set(Graph.graphData().links.filter(l => endId(l.source) === n.id || endId(l.target) === n.id));

// Keep the current viewing direction and move closer to the node.
function flyTo(n, ms) {
  const c = Graph.camera().position;
  let dx = c.x - n.x, dy = c.y - n.y, dz = c.z - n.z;
  const d = Math.hypot(dx, dy, dz) || 1, want = 170 + 10 * Math.cbrt(Graph.nodeVal()(n));
  Graph.cameraPosition({ x: n.x + dx / d * want, y: n.y + dy / d * want, z: n.z + dz / d * want }, { x: n.x, y: n.y, z: n.z }, ms);
}

function focusNode(n) {
  if (busy) return;
  const i = drill.indexOf(n);
  if (i >= 0) return goTo(i + 1);
  views[drill.length] = snapshot();
  views.length = drill.length + 1;
  const visible = Graph.graphData().nodes.includes(n) && n.x !== undefined;
  drill.push(n);
  selected = n;
  curThumb = null;
  showDetail(n);
  renderHistory();
  if (!visible) return enterDrill(n);
  // First fly to it with everything still in view, then open its chain.
  busy = true;
  hlLinks = linksOf(n);
  refresh();
  flyTo(n, 650);
  setTimeout(() => { busy = false; enterDrill(n); }, 700);
}

// The node stays where it is; what is new grows out of it.
function enterDrill(n) {
  if (n.x === undefined) { n.x = 0; n.y = 0; n.z = 0; }
  drill.slice(0, -1).forEach(unpin);
  pin(n);
  const keep = drillSet(n), had = new Set(Graph.graphData().nodes);
  keep.forEach(m => {
    if (m === n) return;
    // Already on screen but far away (a hub from the last view): bring it next to the node.
    if (had.has(m) && m.x !== undefined && Math.hypot(m.x - n.x, m.y - n.y, m.z - n.z) < 400) return;
    m.x = n.x + (Math.random() - 0.5) * 24; m.y = n.y + (Math.random() - 0.5) * 24; m.z = n.z + (Math.random() - 0.5) * 24;
    m.vx = m.vy = m.vz = 0;
  });
  Graph.warmupTicks(0).cooldownTicks(220);
  setData(keep);
  Graph._fitted = false;
  hlLinks = linksOf(n);
  Graph.linkOpacity(0.55);
  refresh();
}

// Back to the perspective at depth `level`, exactly as it was.
function goTo(level) {
  if (busy || level >= drill.length + 1) return;
  const v = views[level];
  drill.forEach(unpin);
  drill = drill.slice(0, level);
  views.length = level;
  selected = drill[level - 1] || null;
  if (selected) pin(selected);
  const keep = selected ? drillSet(selected) : new Set(DATA.nodes.filter(shown));
  if (v) keep.forEach(m => {
    const p = v.pos.get(m.id);
    if (p) { [m.x, m.y, m.z] = p; m.vx = m.vy = m.vz = 0; if (m === selected) pin(m); }
  });
  Graph.warmupTicks(0).cooldownTicks(v ? 0 : 220);
  setData(keep);
  Graph._fitted = !!v;
  if (v) Graph.cameraPosition(v.cam, v.target, 800);
  setTimeout(() => Graph.cooldownTicks(220), 100);
  hlLinks = selected ? linksOf(selected) : new Set();
  Graph.linkOpacity(selected ? 0.55 : stage <= 1 ? 0.6 : 0.22);
  refresh();
  curThumb = v ? v.thumb : null;
  if (selected) showDetail(selected); else showOverview();
  renderHistory();
}
function back() { if (drill.length) goTo(drill.length - 1); }
function clearFocus() { goTo(0); }
addEventListener("keydown", e => {
  if ((e.key === "Escape" || (e.key === "Backspace" && e.target === document.body)) && drill.length) { e.preventDefault(); back(); }
});

function updateCaption() {

function renderHistory() {

// ── Your standing on each risk ────────────────────────────────────────────
// A risk node is a condition from the knowledge layer, the same for everyone.
// Where this person stands: their newest value on each of its markers (against
// the guideline range in the value's unit, else the lab's printed range), and the
// published scores computed from the graph (health_graph/risk.py). Each value
// outside its range counts by its recency; a score by its light and its age.
const LIGHT = { green: "#5DCAA5", amber: "#EF9F27", red: "#E24B4A" };
const COMPOSITE = ["SCORE2", "eGFR", "FIB-4", "TyG", "Triglyceride/HDL", "Remnant"];
const HABITS = {};  // answers to what the graph cannot know: in this page only, never stored
let RANKED = [], overviewClosed = false;
const scoreList = () => ((DATA.scores || {})[HABITS.smoking === "current" ? "smoker" : "nonsmoker"]) || [];
const component = c => c.n.split(" [")[0];
const dotHtml = c => `<span class="dot" style="display:inline-block;margin-right:6px;background:${c}"></span>`;

function markerRows(n) {
  return markerCodes(n).map(c => {
    const s = series(c), last = s.pts[s.pts.length - 1];
    if (!last) return null;
    const b = bandFor(c, s), v = last.v;
    const off = b && ((b.lo != null && v < b.lo) ? "below" : (b.hi != null && v > b.hi) ? "above" : null);
    return { c, o: last.o, off, b, ranged: !!b, guide: b && !b.lab, w: weightOf(last.o.dt) };
  }).filter(Boolean)
    // One marker can sit on two LOINC codes, one per unit (LDL in mg/dL from one
    // lab, mmol/L from another): keep the newest value per marker, named by the
    // LOINC component (the part before " ["), so a 2024 value does not speak for
    // a marker measured again in 2026.
    .sort((a, b) => (b.o.dt || "").localeCompare(a.o.dt || ""))
    .filter((r, i, all) => all.findIndex(x => component(x.c) === component(r.c)) === i);
}

function computeStandings() {
  const pts = { red: 1.5, amber: 0.75 };
  const risks = DATA.nodes.filter(n => n.g === "HealthRisk");
  risks.forEach(n => {
    const rows = markerRows(n);
    const scores = scoreList().filter(x => x.risk === n.rid);
    const E = rows.filter(r => r.off).reduce((a, r) => a + r.w, 0) +
      scores.filter(x => x.value != null && COMPOSITE.some(k => x.name.startsWith(k)))
        .reduce((a, x) => a + (pts[x.light] || 0) * weightOf(x.date), 0);
    const recent = rows.some(r => ageY(r.o.dt) <= 1.5);
    n.st = { rows, scores, E, status: !rows.length ? "none" : E >= 0.4 ? "watch" : recent ? "clear" : "old" };
  });
  const top = risks.filter(n => n.st.status === "watch").sort((a, b) => b.st.E - a.st.E)[0];
  if (top && top.st.E >= 1) top.st.status = "main";
  const order = ["main", "watch", "clear", "old", "none"];
  RANKED = risks.sort((a, b) => order.indexOf(a.st.status) - order.indexOf(b.st.status) || b.st.E - a.st.E);
}

const fmtScore = v => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);
function scoreRow(x) {
  const tip = [x.source, ...Object.entries(x.inputs || {}).map(([k, v]) => `${k}: ${v}`), x.note || ""].filter(Boolean).join("\n");
  if (x.value == null) return `<div class="sc" title="${esc(tip)}"><span class="lt" style="background:#444c58"></span><span><b>${esc(x.name)}</b> <span class="age">${esc(x.note || "not computed")}</span></span></div>`;
  return `<div class="sc" title="${esc(tip)}"><span class="lt" style="background:${LIGHT[x.light] || "#444c58"}"></span>` +
    `<span><b>${esc(x.name)}</b> ${fmtScore(x.value)}${x.unit ? " " + esc(x.unit) : ""}${x.band ? " · " + esc(x.band) : ""}` +
    `${x.date ? ` <span class="age">· ${esc(ago(x.date))}</span>` : ""}</span></div>`;
}
function offRow(r) {
  const src = r.b && r.b.y ? `, ${r.b.y}` : "";
  return `<button class="nb inset" data-id="${r.o.id}" style="opacity:${(0.45 + 0.55 * r.w).toFixed(2)}">${dotHtml(OUT_COLOR)}` +
    `${esc(short(component(r.c)))}: ${esc(r.o.val || "")} · ${esc(ago(r.o.dt))}, ${r.off} the ${r.guide ? "guideline" : "lab's"} range${esc(src)}</button>`;
}

// On the risk's own panel.
function riskStanding(n) {
  const st = n.st, S = STATUS[st.status];
  let html = `<div class="callout"><b>Not a diagnosis.</b> A condition the knowledge layer tracks for everyone, from guidelines. Nothing in your graph says you have it.</div>`;
  html += `<div class="sc" style="font-size:13px"><span class="lt" style="background:${S.color}"></span><span><b>${S.label}</b> in your graph</span></div>`;
  if (!st.rows.length) return html + `<div class="hint">None of its markers has a value of yours yet.</div>`;
  const off = st.rows.filter(r => r.off), unranged = st.rows.filter(r => !r.ranged).length;
  html += `<div class="rel">Your latest values on its markers</div>`;
  html += `<div class="hint" style="margin-top:0">${st.rows.length} marker${st.rows.length > 1 ? "s" : ""} with a value, the newest of each; ` +
    (off.length ? `${off.length} outside the range` : st.rows.length > unranged ? "none outside the range" : "no range to compare them with") +
    (unranged && st.rows.length > unranged ? ` (${unranged} without a range to compare)` : "") + (off.length ? ":" : ".") + `</div>`;
  off.forEach(r => html += offRow(r));
  html += `<div class="hint" style="margin-top:4px">Older values count less, half after a year, and look fainter.</div>`;
  if (st.scores.length) html += `<div class="rel">Scores from your values</div>` + st.scores.map(scoreRow).join("");
  return html;
}

      : a === "before" ? "Values from that time show the medicine's effect, likely your lowest ones; your newest values describe you without it. The graph cannot tell which values those are until the medication and its dates are in it." : "" },
];
const codeNode = new Map(DATA.nodes.filter(n => n.g === "LoincCode").map(n => [loincOf(n), n]));
const KEY_TESTS = [
  ["ApoB", ["1884-6"], "counts the atherogenic particles"], ["Lp(a)", ["10835-7"], "once in life is enough"],
  ["Urine albumin/creatinine", ["9318-7", "14959-1"], "KDIGO reads it with eGFR"], ["HbA1c", ["4548-4", "59261-8"], ""],
  ["Glucose", ["1558-6", "2345-7"], ""], ["Creatinine", ["2160-0"], ""], ["GGT", ["2324-2"], ""], ["Blood pressure", ["8480-6"], ""],
];
function gaps() {
  return KEY_TESTS.map(([name, codes, why]) => {
    const vs = codes.map(c => codeNode.get(c)).filter(Boolean).flatMap(c => nb(c, ["CODED_BY"]))
      .filter(o => o.g === "Lab value" && o.dt).sort((a, b) => b.dt.localeCompare(a.dt));
    if (name === "Lp(a)" && vs.length) return null;  // once in life
    return !vs.length ? { name, why, text: "not measured yet" } : ageY(vs[0].dt) > 2 ? { name, why, text: `last ${ago(vs[0].dt)}` } : null;
  }).filter(Boolean);
}
function olderSources() {
  const seen = new Set();
  return RANKED.flatMap(n => n.st.rows).filter(r => {
    const b = r.b, k = component(r.c);
    if (!b || b.lab || seen.has(k) || !((b.y && TODAY_YEAR - b.y >= 10) || b.until)) return false;
    seen.add(k);
    return true;
  });
}

function showOverview() {
  const el = document.getElementById("detail");
  if (overviewClosed) { el.style.display = "none"; return; }
  const main = RANKED.find(n => n.st.status === "main");
  let html = `<button class="close" aria-label="Close">×</button><div class="kicker">Your risk overview</div>` +
    `<h3>${main ? `Main risk: ${esc(main.n)}` : "No risk stands out in your recent values"}</h3>`;
  if (main) {
    const drivers = main.st.rows.filter(r => r.off).sort((a, b) => b.w - a.w).slice(0, 4).map(r => short(component(r.c)));
    if (drivers.length) html += `<div class="hint" style="margin-top:2px">Driven by ${esc(drivers.join(", "))}.</div>`;
  }
  html += `<div class="callout"><b>Not a diagnosis.</b> The risks are conditions the knowledge layer tracks for everyone. ` +
    `This ranks them by your newest values outside their range and by published scores. A value counts half after one year, ` +
    `so old values weigh less; in the view they sit further back and are smaller. What to do is a question for your doctor.</div>`;
  RANKED.forEach(n => {
    const st = n.st, S = STATUS[st.status], off = st.rows.filter(r => r.off);
    html += `<div class="risk ${st.status}"><button class="head" data-id="${n.id}">${dotHtml(S.color)}${esc(n.n)}<span class="chip ${st.status}">${S.label}</span></button>`;
    if (st.rows.length) {
      const newest = st.rows[0].o.dt;
      html += `<div class="hint" style="margin-top:4px">${st.rows.length} marker${st.rows.length > 1 ? "s" : ""} with a value · ` +
        `${off.length ? off.length + " outside the range" : "none outside the range"} · newest ${esc(ago(newest))}</div>`;
      off.sort((a, b) => b.w - a.w).slice(0, st.status === "main" ? 6 : 3).forEach(r => html += offRow(r));
    } else html += `<div class="hint" style="margin-top:4px">No value of yours on its markers yet.</div>`;
    st.scores.forEach(x => html += scoreRow(x));
    html += `</div>`;
  });
  if (RANKED.some(n => n.rid === "cardiovascular" && n.st.rows.length)) {
    html += `<div class="rel">Beyond LDL: what newer studies add</div><div class="hint" style="margin-top:0">` +
      `LDL cholesterol causes atherosclerosis (EAS consensus 2017) and stays the first target in the ESC/EAS 2025 update. ` +
      `Newer markers add to it, they do not replace it: ApoB counts the atherogenic particles and says more when triglycerides are high; ` +
      `the triglyceride/HDL ratio and the atherogenic index of plasma point to insulin resistance; remnant cholesterol to triglyceride-rich particles. ` +
      `No guideline ranks a ratio of LDL to triglycerides above LDL; the ratio with evidence is triglycerides to HDL. A high HDL is no protection on its own.</div>`;
    BEYOND_LDL.map(id => studyById.get(id)).filter(Boolean).forEach(st =>
      html += `<button class="nb inset" data-id="${st.id}">${dotHtml(COLOR[st.g])}${esc(st.n)}</button>`);
  }
  const older = olderSources();
  if (older.length) {
    html += `<div class="rel">Read critically: older sources behind your values</div>`;
    older.forEach(r => {
      const newer = studyById.get(NEWER[loincOf(r.c)]);
      html += `<div class="hint" style="margin-top:4px"><b>${esc(component(r.c))}</b> (${esc(ago(r.o.dt))}): ${esc(r.b.label)}` +
        (r.b.y ? `, a source from ${r.b.y}` : "") + `.` +
        (newer ? ` Newer: ${esc(newer.n)} sets no target level and advises against routine testing in healthy adults under 75.` : "") + `</div>`;
      if (newer) html += `<button class="nb inset" data-id="${newer.id}">${dotHtml(COLOR[newer.g])}${esc(newer.n)}</button>`;
    });
  }
  html += `<div class="rel">What the graph cannot know</div><div class="hint" style="margin-top:0">` +
    `Your answers change the scores and the notes here. They stay in this page and are gone when you close it.</div>`;
  QUESTIONS.forEach(({ k, q, opts, note }) => {
    html += `<div class="q">${esc(q)}<div class="opts">` + opts.map(([v, l]) =>
      `<button data-q="${k}" data-v="${v}" aria-pressed="${HABITS[k] === v}">${esc(l)}</button>`).join("") + `</div>` +
      (HABITS[k] && note(HABITS[k]) ? `<div class="note">${esc(note(HABITS[k]))}</div>` : "") + `</div>`;
  });
  const g = gaps();
  if (g.length) {
    html += `<div class="rel">Missing or older than two years</div>`;
    g.forEach(x => html += `<div class="hint" style="margin-top:2px">${esc(x.name)}: ${esc(x.text)}${x.why ? ` <span class="age">(${esc(x.why)})</span>` : ""}</div>`);
  }
  html += `<p class="hint">In Claude, with Klarbefund connected: ask “Where are my risks?” or “My cholesterol, with the newer markers”.</p>`;

  el.querySelectorAll(".q button").forEach(b => b.onclick = () => {

    HABITS[k] = HABITS[k] === b.dataset.v ? undefined : b.dataset.v;
    const top = el.scrollTop;
    computeStandings(); refresh(); buildLabels(Graph.graphData().nodes); updateCaption();
    if (!drill.length && stage === 0) document.getElementById("stepHint").textContent = STAGES[0].hint;
    showOverview();
    el.scrollTop = top;
  });
}

function showDetail(n) {
  const el = document.getElementById("detail");
  const dot = m => `<span class="dot" style="display:inline-block;margin-right:6px;background:${m.out ? OUT_COLOR : COLOR[m.g]}"></span>`;
  const btn = (m, text, cls = "") => `<button class="nb ${cls}" data-id="${m.id}">${dot(m)}${esc(text || m.n)}</button>`;
  const trail = [`<a href="#" data-back="-1">${esc(STAGES[stage].name)}</a>`,
    ...drill.map((m, i) => i === drill.length - 1 ? `<b>${esc(short(m.n))}</b>` : `<a href="#" data-back="${i}">${esc(short(m.n))}</a>`)];
  let html = `<button class="close" aria-label="Close">×</button><div class="trail">${trail.join(" › ")}</div>` +
    `<h3>${esc(n.n)}</h3><div class="tag">${dot(n)}${esc(n.g)} · ${n.deg} relationships</div>`;
  if (n.d.length) html += "<ul>" + n.d.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>";

  if (n.g === "LoincCode") html += chartsFor(n);
  if (n.g === "Lab value" || n.g === "Apple Watch week") {
    const c = nb(n, ["CODED_BY"]).find(m => m.g === "LoincCode");
    if (c) html += chartsFor(c, n);
  }

  if (n.g === "HealthRisk") html += riskStanding(n);

  // How this condition makes others more likely, and the reverse, with the studies.
  // Population evidence: what happens in people who HAVE the condition.
  if (n.rlinks) [["out", "In people who have it, studies find more"], ["in", "It is more common in people who have"]].forEach(([dir, title]) => {
    const ls = n.rlinks.filter(x => x.dir === dir);
    if (!ls.length) return;
    html += `<div class="rel">${title}</div>`;
    ls.forEach(x => {
      html += btn(x.other, `${dir === "out" ? "→" : "←"} ${x.other.n}${effect(x.p)}`, "code");
      if (x.p.summary) html += `<div class="hint inset" style="margin-top:0">${esc(x.p.summary)}</div>`;
      (x.p.studies || []).forEach(id => { const st = studyById.get(id); if (st) html += btn(st, st.d[1] || st.n, "inset"); });
    });
  });
  if (isEvidence(n)) {
    const ext = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent)">${t} ↗</a>` : "";
    html += `<p>${[ext(n.url, "Paper (DOI)"), ext(n.pubmed, "PubMed")].filter(Boolean).join(" · ")}</p>`;
    // The markers it examines, with your latest value on each.
    const ex = nb(n, ["EXAMINES"]);
    if (ex.length) {
      html += `<div class="rel">Markers it examines, your latest value</div>`;
      ex.map(c => ({ c, v: nb(c, ["CODED_BY"]).filter(o => o.g === "Lab value" && !o.dup).sort((a, b) => (b.dt || "").localeCompare(a.dt || ""))[0] }))
        .sort((a, b) => (b.v ? 1 : 0) - (a.v ? 1 : 0) || (b.v?.out ? 1 : 0) - (a.v?.out ? 1 : 0))
        .forEach(({ c, v }) => {
          html += btn(c, c.n, "code");
          html += v ? btn(v, `${v.dt || "?"} · ${v.val || v.n}`, "inset").replace("</button>", v.out ? ` <span class="flag">outside range</span></button>` : "</button>")
                    : `<div class="hint inset" style="margin-top:0">No value of yours yet</div>`;
        });
    }
    const ev = DATA.links.filter(l => l.p && (l.p.studies || []).includes(n.sid));
    if (ev.length) {
      html += `<div class="rel">Evidence for</div>`;
      ev.forEach(l => {
        const a = byId.get(endId(l.source)), b = byId.get(endId(l.target));
        html += btn(a, `${a.n} → ${b.n}${effect(l.p)}`);
      });
    }
  }

  const codes = n.g === "LoincCode" ? [] : markerCodes(n);
  if (codes.length) {
    const rows = codes.map(c => ({ c, vs: nb(c, ["CODED_BY"]).filter(o => o.g === "Lab value" && !o.dup)
      .sort((a, b) => (b.dt || "").localeCompare(a.dt || "")) }))
      .sort((a, b) => (b.vs[0]?.out ? 1 : 0) - (a.vs[0]?.out ? 1 : 0) || b.vs.length - a.vs.length);
    html += `<div class="rel">Your values, newest first</div>`;
    rows.forEach(({ c, vs }) => {
      html += btn(c, `${c.n}${vs.length ? ` (${vs.length})` : ""}`, "code");
      if (!vs.length) html += `<div class="hint inset" style="margin-top:0">No value yet</div>`;
      else if (vs.length > 1) html += `<div class="inset" style="padding-left:20px">${chart(c, { spark: true, w: 300 })}</div>`;
      vs.slice(0, 3).forEach(v => html += btn(v, `${v.dt || "?"} · ${v.val || v.n}`, "inset") .replace("</button>", v.out ? ` <span class="flag">outside range</span></button>` : "</button>"));
      if (vs.length > 3) html += `<div class="hint inset" style="margin-top:0">… ${vs.length - 3} older: click the code for the chart</div>`;
    });
  }

  const groups = {};
  n.nbs.forEach(([t, m, dir]) => {
    const key = dir === "out" ? `${t} →` : `← ${t}`;
    (groups[key] = groups[key] || []).push(m);
  });
  Object.entries(groups).sort((a, b) => a[1].length - b[1].length).forEach(([k, ms]) => {
    if (codes.length && /CODED_BY/.test(k)) return;  // listed above, by date
    if (n.rlinks && /RAISES_RISK_OF/.test(k)) return;  // listed above, with the studies
    if (isEvidence(n) && /EXAMINES/.test(k)) return;    // listed above, with your values
    html += `<div class="rel">${esc(FRIENDLY[k] || k)} (${ms.length})</div>`;
    if (ms.length > 40) {
      // A long list says little item by item: group it by name, newest first within a name.
      const groups = new Map();
      ms.forEach(m => groups.set(m.n, [...(groups.get(m.n) || []), m]));
      [...groups].sort((a, b) => b[1].length - a[1].length).slice(0, 40).forEach(([name, list]) => {
        const newest = list.sort((a, b) => (b.dt || "").localeCompare(a.dt || ""))[0];
        html += btn(newest, `${name} (${list.length})`);
      });
      if (groups.size > 40) html += `<div class="hint">… and ${groups.size - 40} more names</div>`;
    } else ms.forEach(m => html += btn(m));
  });
  el.innerHTML = html;
  el.style.display = "block";
  el.scrollTop = 0;
  el.querySelector(".close").onclick = clearFocus;
  el.querySelectorAll(".nb, .chart .hit").forEach(b => b.onclick = () => focusNode(nodeById(b.dataset.id)));
  el.querySelectorAll("[data-back]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const i = +a.dataset.back;
    goTo(i + 1);
  });
}


// ── Time-series charts in the panel ──────────────────────────────────────
// Real calendar spacing; the guideline range as a band (darker: optimal); out
// of range in red with a ring; the latest value labelled; one shape per lab.
const SVGNS = "http://www.w3.org/2000/svg";
const BAND = "rgba(93, 202, 165, 0.13)", BAND2 = "rgba(93, 202, 165, 0.26)", LABBAND = "rgba(175, 169, 236, 0.16)";
const day = 864e5;
const fmt = v => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? (+v.toFixed(1)).toString() : (+v.toPrecision(3)).toString();
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function series(code, device) {
  const obs = nb(code, ["CODED_BY"]).filter(o => (device ? o.g === "Apple Watch week" : o.g === "Lab value" && !o.dup)
    && typeof o.v === "number" && o.dt);
  const cnt = {};
  obs.forEach(o => cnt[o.u] = (cnt[o.u] || 0) + 1);
  const unit = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] ?? "";
  const pts = obs.filter(o => o.u === unit).map(o => ({ o, t: Date.parse(o.dt.slice(0, 10)), v: o.v }))
    .filter(p => !isNaN(p.t)).sort((a, b) => a.t - b.t);
  return { pts, unit, other: obs.length - pts.length };
}

// The guideline range in the values' unit, for this person's sex (or "any");
// otherwise the range the lab printed on its latest report.
function bandFor(code, s) {
  const rs = nb(code, ["APPLIES_TO"]).map(r => r.r).filter(r => r && r.u === s.unit && (r.gl != null || r.gh != null));
  // Today's edition first; a superseded range only when nothing replaced it, and then labelled so.
  const current = rs.filter(r => !r.until), pool = current.length ? current : rs;
  const g = pool.find(r => DATA.sex && r.sex === DATA.sex) || pool.find(r => r.sex === "any");
  if (g) return { lo: g.gl, hi: g.gh, olo: g.ol, ohi: g.oh, fill: BAND, y: g.y, until: g.until,
    label: (g.until ? `Former guideline range, superseded on ${g.until}` : "Guideline range") + (g.src ? ` (${g.src})` : "") };
  const last = [...s.pts].reverse().find(p => p.o.rl != null || p.o.rh != null);
  if (last) return { lo: last.o.rl, hi: last.o.rh, label: "Range printed by the lab", fill: LABBAND, lab: true };
  return null;
}

function niceStep(span, n) {
  const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
}

function timeTicks(t0, t1) {
  const a = new Date(t0), b = new Date(t1), out = [];
  const months = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (months >= 24) {
    const every = Math.ceil((months / 12) / 5);
    for (let y = a.getFullYear() + 1; y <= b.getFullYear(); y += every) out.push([Date.UTC(y, 0, 1), String(y)]);
  } else {
    const every = Math.max(1, Math.ceil(months / 5));
    for (let m = 1; m <= months + 1; m += every) {
      const d = new Date(Date.UTC(a.getFullYear(), a.getMonth() + m, 1));
      if (d.getTime() <= t1) out.push([d.getTime(), `${MONTHS[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`]);
    }
  }
  return out;
}

const SHAPES = ["circle", "square", "diamond", "triangle"];
function mark(shape, x, y, r, attrs) {
  if (shape === "square") return `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" ${attrs}/>`;
  if (shape === "diamond") return `<path d="M${x} ${y - r * 1.3}L${x + r * 1.3} ${y}L${x} ${y + r * 1.3}L${x - r * 1.3} ${y}Z" ${attrs}/>`;
  if (shape === "triangle") return `<path d="M${x} ${y - r * 1.3}L${x + r * 1.2} ${y + r}L${x - r * 1.2} ${y + r}Z" ${attrs}/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" ${attrs}/>`;
}

function chart(code, { device = false, spark = false, focus = null, w = 328 } = {}) {
  const s = series(code, device);
  if (!s.pts.length) return "";
  const H = spark ? 34 : 176, W = w;
  const m = spark ? { l: 2, r: 2, t: 4, b: 4 } : { l: 36, r: 12, t: 12, b: 22 };
  const band = device ? null : bandFor(code, s);
  const vs = s.pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (band) { if (band.lo != null) lo = Math.min(lo, band.lo); if (band.hi != null) hi = Math.max(hi, band.hi); }
  const pad = (hi - lo || Math.abs(hi) || 1) * (band ? 0.22 : 0.12);  // room outside the band, so its edges show
  lo -= pad; hi += pad;
  if (vs.every(v => v >= 0) && lo < 0) lo = 0;
  let t0 = s.pts[0].t, t1 = s.pts[s.pts.length - 1].t;
  if (t1 - t0 < 30 * day) { t0 -= 30 * day; t1 += 30 * day; }
  const tp = (t1 - t0) * 0.04;
  t0 -= tp; t1 += tp;
  const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - lo) / (hi - lo) * (H - m.t - m.b);
  const name = `${code.n}${s.unit ? " in " + s.unit : ""}`;
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(name)}, ${s.pts.length} values over time">`;

  if (band) {
    const yt = Y(band.hi ?? hi), yb = Y(band.lo ?? lo);
    g += `<rect x="${m.l}" y="${yt}" width="${W - m.l - m.r}" height="${Math.max(0, yb - yt)}" fill="${band.fill}"/>`;
    if ((band.olo != null || band.ohi != null) && (band.olo !== band.lo || band.ohi !== band.hi)) {
      const ot = Y(band.ohi ?? band.hi ?? hi), ob = Y(band.olo ?? band.lo ?? lo);
      g += `<rect x="${m.l}" y="${ot}" width="${W - m.l - m.r}" height="${Math.max(0, ob - ot)}" fill="${BAND2}"/>`;
    }
  }
  if (band && !spark) [band.lo, band.hi].filter(v => v != null).forEach(v => {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#5DCAA5" stroke-opacity="0.55" stroke-dasharray="3 3"/>` +
      `<text x="${W - m.r}" y="${Y(v) - 3}" text-anchor="end" style="fill:#5DCAA5">${fmt(v)}</text>`;
  });
  if (!spark) {
    const step = niceStep(hi - lo, 3);
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a303a" stroke-width="1"/>` +
        `<text x="${m.l - 6}" y="${Y(v) + 3}" text-anchor="end">${fmt(v)}</text>`;
    }
    timeTicks(t0, t1).forEach(([t, l]) => {
      g += `<line x1="${X(t)}" x2="${X(t)}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="#444c58"/>` +
        `<text x="${X(t)}" y="${H - 6}" text-anchor="middle">${l}</text>`;
    });
  }

  if (device) {
    // Faint weekly means, a bold four-week average on top.
    s.pts.forEach(p => g += `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="${spark ? 1 : 1.8}" fill="#85B7EB" opacity="0.35"/>`);
    const avg = s.pts.map((p, i) => {
      const win = s.pts.slice(Math.max(0, i - 3), i + 1);
      return [X(p.t), Y(win.reduce((a, q) => a + q.v, 0) / win.length)];
    });
    g += `<polyline points="${avg.map(a => a.join(",")).join(" ")}" fill="none" stroke="#85B7EB" stroke-width="2" stroke-linejoin="round"/>`;
  } else {
    g += `<polyline points="${s.pts.map(p => `${X(p.t)},${Y(p.v)}`).join(" ")}" fill="none" stroke="#5DCAA5" stroke-opacity="0.7" stroke-width="${spark ? 1.2 : 1.5}"/>`;
  }

  const labs = [...new Set(s.pts.map(p => p.o.lab || ""))]
    .sort((a, b) => s.pts.filter(p => (p.o.lab || "") === b).length - s.pts.filter(p => (p.o.lab || "") === a).length);
  const shapeOf = o => SHAPES[Math.min(labs.indexOf(o.lab || ""), SHAPES.length - 1)];
  if (!device) s.pts.forEach(p => {
    const x = X(p.t), y = Y(p.v), c = p.o.out ? OUT_COLOR : "#5DCAA5";
    const tip = `${p.o.dt} · ${p.o.val}${p.o.out ? " · outside the lab's range" : ""}${p.o.lab ? " · " + p.o.lab : ""}`;
    if (!spark) g += `<circle class="hit" data-id="${p.o.id}" cx="${x}" cy="${y}" r="10"><title>${esc(tip)}</title></circle>`;
    g += mark(shapeOf(p.o), x, y, spark ? 2.2 : 4, `class="pt${p.o === focus ? " hl" : ""}" fill="${c}" stroke="#0e1116" stroke-width="1.5"`);
    if (p.o.out && !spark) g += `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="${OUT_COLOR}" stroke-width="1"/>`;
  });
  if (device && focus) {
    const p = s.pts.find(q => q.o === focus);
    if (p) g += `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" fill="#85B7EB" stroke="#fff" stroke-width="2"/>`;
  }
  if (!spark) {
    const last = s.pts[s.pts.length - 1], x = X(last.t), y = Y(last.v);
    const right = x > W - 70;
    g += `<text class="last" x="${right ? x - 9 : x + 9}" y="${y - 8}" text-anchor="${right ? "end" : "start"}">${esc(fmt(last.v))}${device ? "" : ""}</text>`;
  }
  g += "</svg>";
  if (spark) return g;

  let note = `<div class="chartnote">${s.pts.length} ${device ? "weekly means, line: 4-week average" : "values"}${s.unit ? ` in ${esc(s.unit)}` : ""}`;
  if (band) note += ` · <i style="background:${band.fill}"></i>${esc(band.label)}` + ((band.olo != null || band.ohi != null) && (band.olo !== band.lo || band.ohi !== band.hi) ? ` · <i style="background:${BAND2}"></i>optimal` : "");
  if (!device && s.pts.some(p => p.o.out)) note += ` · <span class="flag">● outside the lab's range</span>`;
  if (labs.length > 1) note += "<br>" + labs.slice(0, SHAPES.length).map((l, i) => `${["●", "■", "◆", "▲"][i]} ${esc(l || "lab not recorded")}`).join(" · ");
  if (s.other) note += `<br>${s.other} more in other units, not drawn`;
  return g + note + "</div>";
}

function chartsFor(code, focus) {
  let html = "";
  const lab = chart(code, { focus });
  const dev = chart(code, { device: true, focus });
  if (lab) html += `<div class="rel">Over time</div>${lab}`;
  if (dev) html += `<div class="rel">Apple Watch, weekly</div>${dev}`;
  return html;
}

// Names next to the nodes while few are shown.
const labelsEl = document.getElementById("labels");
let labelled = [];
function buildLabels(nodes) {
  labelsEl.innerHTML = "";
  labelled = [];
  // The years of the time spiral, always; without a spiral, how far back a value sits.
  spiralMarks.forEach(m => {
    const d = document.createElement("div");
    d.className = "year"; d.textContent = m.label;
    labelsEl.appendChild(d); labelled.push([m, d]);
  });
  makeDepthMarks(nodes);
  depthMarks.forEach(m => {
    const d = document.createElement("div");
    d.className = "depth"; d.textContent = m.label;
    labelsEl.appendChild(d); labelled.push([m, d]);
  });
  if (nodes.length > 200) return;
  const top = drill[drill.length - 1];
  const allValues = top && !["HealthRisk", "RiskScore"].includes(top.g);
  nodes.forEach(n => {
    if (["Apple Watch week", "Provenance", "OMOPMeasurement", "OMOPPerson"].includes(n.g)) return;
    if (n.g === "ReferenceRange" && !(top && top.g === "LoincCode")) return;
    if (isEvidence(n) && !top) return;                     // named in the drill-down, not in the overview
    if (n.g === "Topic" && !top && stage !== 1) return;
    if (n.g === "Lab value" && !(allValues || n.cur || n.out)) return;
    const d = document.createElement("div");
    d.textContent = n.g === "Lab value" ? `${n.val || ""}${n.dt ? " · " + n.dt.slice(0, 7) : ""}`
      : n.g === "HealthRisk" && n.st && !top ? `${short(n.n)} · ${STATUS[n.st.status].short}` : short(n.n);
    if (n.out) d.style.color = "#F7C1C1";
    if (n.g === "HealthRisk" && n.st && n.st.status === "main" && !top) { d.style.color = "#F7C1C1"; d.style.fontWeight = "600"; d.style.fontSize = "13px"; }
    if (isDated(n)) d.style.opacity = (0.35 + 0.65 * recency(n)).toFixed(2);
    if (n === top) d.style.fontWeight = "600";
    labelsEl.appendChild(d);
    labelled.push([n, d]);
  });
}
// Without a spiral, labels at the depth of now, one year ago, two years ago, left of what is shown.
let depthMarks = [], frame = 0;
function makeDepthMarks(nodes) {
  depthMarks = [];
  if (spiralMarks.length) return;
  const ages = nodes.filter(n => isDated(n) && n.dt).map(n => ageY(n.dt)).filter(a => !isNaN(a));
  if (ages.length < 2) return;
  const max = Math.min(Math.ceil(Math.max(...ages)), 8);
  if (drill.length) return;  // in a drill-down the depth is relative to the node in focus: no absolute years
  for (let k = 0; k <= max; k++) depthMarks.push({ z: -DEPTH * k, label: k === 0 ? "now" : k === 1 ? "1 year ago" : `${k} years ago` });
}
function placeDepthMarks() {
  const ns = Graph.graphData().nodes.filter(n => n.x !== undefined);
  if (!ns.length || !depthMarks.length) return;
  const x = Math.min(...ns.map(n => n.x)) - 30, y = Math.max(...ns.map(n => n.y)) + 20;
  depthMarks.forEach(m => { m.x = x; m.y = y; });
}
(function tickLabels() {
  if (++frame % 15 === 0) placeDepthMarks();
  if (labelled.length) {
    const cam = Graph.camera(), e = cam.matrixWorld.elements, p = cam.position;
    labelled.forEach(([n, d]) => {
      if (n.x === undefined) { d.style.display = "none"; return; }
      const ahead = -(n.x - p.x) * e[8] - (n.y - p.y) * e[9] - (n.z - p.z) * e[10];
      const c = Graph.graph2ScreenCoords(n.x, n.y, n.z);
      const ok = ahead > 0 && c.x > 0 && c.y > 0 && c.x < innerWidth && c.y < innerHeight;
      d.style.display = ok ? "block" : "none";
      if (ok) { d.style.left = c.x + "px"; d.style.top = c.y + "px"; }
    });
  }
  requestAnimationFrame(tickLabels);
})();

const legend = document.getElementById("legend");
FAMILIES.forEach(([fam, gs]) => {
  const box = document.createElement("div");
  box.className = "fam";
  box.innerHTML = `<h2>${esc(fam)}</h2>` + gs.filter(([g]) => counts[g]).map(([g, c]) =>
    `<label class="row"><input type="checkbox" data-g="${esc(g)}" checked><span class="dot" style="background:${c}"></span>${esc(g)}<span class="count">${counts[g].toLocaleString()}</span></label>`).join("");
  legend.appendChild(box);
});
// Evidence by topic: every study and guideline, one click away.
(function renderTopics() {
  const el = document.getElementById("topics");
  const rows = [...topicNodes.values()].map(t => ({ t, ms: nb(t, ["IN_TOPIC"]) })).sort((a, b) => b.ms.length - a.ms.length);
  el.innerHTML = `<div class="fam"><h2>Evidence by topic</h2>` + rows.map(({ t, ms }) =>
    `<details><summary><span class="dot" style="background:${COLOR.Topic}"></span>${esc(t.n)}<span class="count">${ms.length}</span></summary>` +
    `<button class="nb" data-id="${esc(t.id)}"><b>Show the cluster</b></button>` +
    ms.sort((a, b) => a.g.localeCompare(b.g) || a.n.localeCompare(b.n)).map(m =>
      `<button class="nb" data-id="${esc(m.id)}" title="${esc(m.d[1] || m.n)}"><span class="dot" style="display:inline-block;margin-right:6px;background:${COLOR[m.g]}"></span>${esc(m.n)}</button>`).join("") +
    `</details>`).join("") + `</div>`;
  el.querySelectorAll(".nb").forEach(b => b.onclick = () => focusNode(nodeById(b.dataset.id)));
})();
legend.addEventListener("change", e => { VISIBLE[e.target.dataset.g] = e.target.checked; applyFilter(); });
function syncChecks() { legend.querySelectorAll("input").forEach(i => i.checked = VISIBLE[i.dataset.g]); }

const steps = document.getElementById("steps");
STAGES.forEach((st, i) => {
  const b = document.createElement("button");
  b.setAttribute("role", "tab");
  b.innerHTML = `<b>${i + 1}</b>${esc(st.name)}`;
  b.onclick = () => setStage(i);
  steps.appendChild(b);
});
function setStage(i, fit = true) {
  stage = i;
  drill.forEach(unpin);
  drill = []; views = []; selected = null; hlLinks = new Set();
  showOverview();
  renderHistory();
  Graph.warmupTicks(40).cooldownTicks(220);
  Object.keys(VISIBLE).forEach(g => VISIBLE[g] = true);
  steps.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", j === i));
  document.getElementById("stepHint").textContent = STAGES[i].hint;
  document.getElementById("next").textContent = i < STAGES.length - 1 ? `Next: ${STAGES[i + 1].name} →` : "Back to health risks";
  legend.querySelectorAll("label.row").forEach(l => l.style.opacity = STAGES[i].groups.includes(l.querySelector("input").dataset.g) ? 1 : 0.35);
  Graph.linkOpacity(i <= 1 ? 0.6 : 0.22);
  syncChecks();
  applyFilter();
  refresh();
}
document.getElementById("next").onclick = () => setStage((stage + 1) % STAGES.length);
document.getElementById("fit").onclick = () => Graph.zoomToFit(800, 40);
document.getElementById("ovbtn").onclick = () => { overviewClosed = false; if (drill.length) goTo(0); else showOverview(); };

const q = document.getElementById("q"), hits = document.getElementById("hits");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  hits.innerHTML = "";
  if (s.length < 2) return;
  const found = DATA.nodes.filter(n => n.n.toLowerCase().includes(s) || n.d.some(x => x.toLowerCase().includes(s)))
    .sort((a, b) => b.deg - a.deg).slice(0, 12);
  found.forEach(n => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="dot" style="display:inline-block;margin-right:6px;background:${COLOR[n.g]}"></span>${esc(n.n)} <span style="color:var(--muted)">· ${esc(n.g)}</span>`;
    b.onclick = () => focusNode(n);
    hits.appendChild(b);
  });
  if (!found.length) hits.innerHTML = `<div class="hint">No match.</div>`;
});

computeStandings();
// Start a little from the side and above: time runs into the depth, so straight on
// the years would stack behind each other. Fitting keeps this direction.
Graph.cameraPosition({ x: 520, y: 300, z: 860 });
setStage(0);
// After a layout settles: frame it, then take the thumbnail of where you are.
Graph.onEngineStop(() => {
  if (Graph._fitted) return;
  Graph._fitted = true;
  Graph.zoomToFit(900, 60);
  if (drill.length) setTimeout(() => { if (!busy) { curThumb = snapshot().thumb; renderHistory(); } }, 1000);
});
window.addEventListener("resize", () => Graph.width(innerWidth).height(innerHeight));
</script>
